<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafael Costa — Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d0b0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Sunset Aura Background (Vibe quente e amigável) */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 150vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, rgba(245, 158, 11, 0.2) 40%, transparent 70%);
            filter: blur(100px);
            z-index: -2;
            animation: pulseAura 12s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% {
                transform: translate(-50%, -50%) scale(0.9) rotate(0deg);
                opacity: 0.6;
            }

            100% {
                transform: translate(-50%, -40%) scale(1.1) rotate(15deg);
                opacity: 1;
            }
        }

        .stage-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(13, 11, 15, 0.5) 0%, #0d0b0f 85%);
            pointer-events: none;
        }

        .noise {
            position: fixed;
            inset: 0;
            opacity: 0.05;
            pointer-events: none;
            z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 60px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            z-index: 1;
        }

        /* Profile Header */
        .artist-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            width: 100%;
            text-align: center;
        }

        .artist-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(236, 72, 153, 0.4);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .artist-img:hover {
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6), 0 0 0 4px #ec4899, 0 0 30px rgba(236, 72, 153, 0.5);
        }

        .artist-name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            line-height: 1.2;
        }

        .artist-genre {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
            max-width: 300px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Hero Card (Destaque) */
        .player-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 32px;
            position: relative;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s ease, border-color 0.4s;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            display: block;
        }

        .player-card:hover {
            transform: translateY(-4px);
            border-color: rgba(245, 158, 11, 0.4);
            /* Amber */
        }

        .player-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 2;
        }

        .track-art {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease;
        }

        .player-card:hover .track-art {
            transform: scale(1.05) rotate(2deg);
        }

        .track-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .track-artist {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-artist span {
            background: linear-gradient(135deg, #ec4899, #f59e0b);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #fff;
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .player-card:hover .play-btn {
            background: #fff;
            color: #ec4899;
            transform: scale(1.1) translateX(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Glass Links Embutidos */
        .platforms {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .platform-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .platform-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .platform-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(236, 72, 153, 0.4);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .platform-btn:hover::before {
            opacity: 1;
        }

        .plat-left {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        .plat-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            transition: transform 0.4s, background 0.4s;
            color: #f59e0b;
            /* Amber */
        }

        .platform-btn:hover .plat-icon {
            transform: scale(1.1) rotate(10deg);
            background: rgba(255, 255, 255, 0.15);
            color: #ec4899;
            /* Pink */
        }

        .plat-arrow {
            color: rgba(255, 255, 255, 0.3);
            transition: transform 0.4s, color 0.4s;
            z-index: 2;
        }

        .platform-btn:hover .plat-arrow {
            transform: translateX(4px);
            color: #ec4899;
        }

        /* Botão Ação Social Secundária (Redonda) */
        .social-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
        }

        .social-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .social-circle:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Animations */
        .reveal {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .d-1 {
            animation-delay: 0.1s;
        }

        .d-2 {
            animation-delay: 0.2s;
        }

        .d-3 {
            animation-delay: 0.3s;
        }

        /* Responsive Mobile First Tweaks */
        @media (max-width: 380px) {
            .container {
                padding: 40px 16px;
            }

            .artist-img {
                width: 90px;
                height: 90px;
            }

            .artist-name {
                font-size: 26px;
            }

            .artist-genre {
                font-size: 13px;
                max-width: 260px;
            }

            .player-inner {
                gap: 12px;
            }

            .track-art {
                width: 60px;
                height: 60px;
            }

            .track-title {
                font-size: 14px;
            }

            .track-artist {
                font-size: 11px;
            }

            .platform-btn {
                padding: 14px 16px;
                font-size: 13px;
            }

            .plat-icon {
                width: 32px;
                height: 32px;
            }

            .social-circle {
                width: 48px;
                height: 48px;
            }
        }
    </style></head>

<body>
    <!-- Background Aura Quente -->
    <div class="ambient-glow"></div>
    <div class="stage-overlay"></div>
    <div class="noise"></div>

    <div class="container">
        <!-- Perfil Pessoal Físico -->
        <div class="artist-header reveal">
            <img class="artist-img"
                src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300&h=300&fit=crop"
                alt="Rafael Costa">
            <h1 class="artist-name">Rafael Costa</h1>
            <div class="artist-genre">
                Compartilhando viagens, código e café. Em São Paulo.
            </div>
        </div>

        <!-- Hero Card (Destaque Vlog/Blog) -->
        <a href="#" class="player-card reveal d-1">
            <div class="player-inner">
                <img class="track-art"
                    src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=200&h=200&fit=crop" alt="Setup">
                <div class="track-info">
                    <div class="track-title">Meu Setup 2024</div>
                    <div class="track-artist">Assista ao Review <span>YouTube</span></div>
                </div>
                <div class="play-btn"><i data-lucide="play" style="width:20px;height:20px;fill:currentColor"></i></div>
            </div>
        </a>

        <!-- Links Rápidos -->
        <div class="platforms reveal d-2">
            <a href="#" class="platform-btn">
                <div class="plat-left">
                    <div class="plat-icon"><i data-lucide="message-circle" style="width:18px;height:18px;"></i></div>
                    <span>Me Chama no WhatsApp</span>
                </div>
                <i data-lucide="chevron-right" class="plat-arrow" style="width:20px;height:20px"></i>
            </a>

            <a href="#" class="platform-btn">
                <div class="plat-left">
                    <div class="plat-icon"><i data-lucide="coffee" style="width:18px;height:18px;"></i></div>
                    <span>Apoie Meu Trabalho (Ko-fi)</span>
                </div>
                <i data-lucide="chevron-right" class="plat-arrow" style="width:20px;height:20px"></i>
            </a>

            <a href="#" class="platform-btn">
                <div class="plat-left">
                    <div class="plat-icon"><i data-lucide="map" style="width:18px;height:18px;"></i></div>
                    <span>Roteiro Exclusivo da Viagem</span>
                </div>
                <i data-lucide="chevron-right" class="plat-arrow" style="width:20px;height:20px"></i>
            </a>
        </div>

        <!-- Social Icons Bottom -->
        <div class="social-row reveal d-3">
            <a href="#" class="social-circle" aria-label="Instagram"><i data-lucide="instagram"
                    style="width:22px;height:22px"></i></a>
            <a href="#" class="social-circle" aria-label="YouTube"><i data-lucide="youtube"
                    style="width:22px;height:22px"></i></a>
            <a href="#" class="social-circle" aria-label="Twitter"><i data-lucide="twitter"
                    style="width:22px;height:22px"></i></a>
            <a href="#" class="social-circle" aria-label="GitHub"><i data-lucide="github"
                    style="width:22px;height:22px"></i></a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
