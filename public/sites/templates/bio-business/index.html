<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barba & Navalha — Links</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Ambient Top Glow */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: radial-gradient(ellipse at top, rgba(245, 158, 11, 0.15), transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 60px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Modern Square Avatar */
        .avatar-container {
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
            border-radius: 20px;
            padding: 4px;
            background: linear-gradient(135deg, #f59e0b, #78350f);
            box-shadow: 0 20px 40px -10px rgba(245, 158, 11, 0.3);
            position: relative;
            transform: rotate(-3deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-container:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            background: #111;
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            text-align: center;
            color: #ffffff;
            text-transform: uppercase;
        }

        .title span {
            color: #f59e0b;
            /* Amber */
        }

        .subtitle {
            font-size: 15px;
            color: #a3a3a3;
            font-weight: 400;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 320px;
        }

        /* Sharp Modern Links */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modern-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: #121212;
            border: 1px solid #262626;
            border-radius: 12px;
            text-decoration: none;
            color: #f5f5f5;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .modern-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #f59e0b;
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .modern-link:hover {
            background: #1a1a1a;
            border-color: #3f3f46;
            transform: translateY(-2px);
        }

        .modern-link:hover::before {
            transform: scaleY(1);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-icon-wrap {
            color: #a3a3a3;
            display: flex;
            transition: color 0.3s ease;
        }

        .modern-link:hover .link-icon-wrap {
            color: #f59e0b;
        }

        .link-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .link-arrow {
            color: #404040;
            transition: all 0.3s ease;
        }

        .modern-link:hover .link-arrow {
            color: #f59e0b;
            transform: translateX(4px);
        }

        /* Sharp Highlight Area */
        .highlight-box {
            width: 100%;
            margin-top: 48px;
            padding: 40px 32px;
            border-radius: 20px;
            background: linear-gradient(145deg, #18181b, #09090b);
            border: 1px solid #27272a;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .highlight-box::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.1), transparent 70%);
            transform: translate(30%, -30%);
            pointer-events: none;
        }

        .hb-eyebrow {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #f59e0b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hb-title {
            font-family: 'Outfit', sans-serif;
            color: #fff;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .hb-desc {
            font-size: 14px;
            color: #a3a3a3;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .hb-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            background: #f59e0b;
            color: #000;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 12px;
            transition: all 0.3s;
            width: 100%;
        }

        .hb-btn:hover {
            background: #fbbf24;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
        }

        /* Minimalist Footer */
        .footer-socials {
            display: flex;
            gap: 20px;
            margin-top: 48px;
            padding-bottom: 24px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #121212;
            border: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a3a3a3;
            transition: all 0.3s;
        }

        .social-link:hover {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #000;
            transform: translateY(-4px);
        }

        /* Animations */
        .reveal {
            animation: revealFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        @keyframes revealFade {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .d-1 {
            animation-delay: 0.1s;
        }

        .d-2 {
            animation-delay: 0.2s;
        }

        .d-3 {
            animation-delay: 0.3s;
        }

        .d-4 {
            animation-delay: 0.4s;
        }

        .d-5 {
            animation-delay: 0.5s;
        }

        @media (max-width: 380px) {
            .container {
                padding: 40px 16px;
            }

            .avatar-container {
                width: 90px;
                height: 90px;
            }

            .title {
                font-size: 32px;
            }

            .modern-link {
                padding: 16px 20px;
            }

            .highlight-box {
                padding: 32px 24px;
            }
        }
    </style></head>

<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Modern Avatar -->
        <div class="avatar-container reveal">
            <img src="https://images.unsplash.com/photo-1599305090598-fe179d501227?w=200&h=200&fit=crop"
                alt="Barbearia">
        </div>

        <h1 class="title reveal d-1">Barba <span>&</span> Navalha</h1>
        <p class="subtitle reveal d-2">Estilo sem meio termo. Cortes precisos, barboterapia premium e ambiente de
            respeito.
        </p>

        <!-- Sharp Links -->
        <div class="links-wrapper reveal d-3">
            <a href="#" class="modern-link">
                <div class="link-content">
                    <div class="link-icon-wrap"><i data-lucide="scissors" style="width:20px;height:20px"></i></div>
                    <span class="link-text">Serviços e Valores</span>
                </div>
                <i data-lucide="arrow-right" class="link-arrow" style="width:18px;height:18px"></i>
            </a>

            <a href="#" class="modern-link">
                <div class="link-content">
                    <div class="link-icon-wrap"><i data-lucide="map-pin" style="width:20px;height:20px"></i></div>
                    <span class="link-text">Como Chegar</span>
                </div>
                <i data-lucide="arrow-right" class="link-arrow" style="width:18px;height:18px"></i>
            </a>

            <a href="#" class="modern-link">
                <div class="link-content">
                    <div class="link-icon-wrap"><i data-lucide="instagram" style="width:20px;height:20px"></i></div>
                    <span class="link-text">Nosso Portfólio</span>
                </div>
                <i data-lucide="arrow-right" class="link-arrow" style="width:18px;height:18px"></i>
            </a>

            <a href="#" class="modern-link">
                <div class="link-content">
                    <div class="link-icon-wrap"><i data-lucide="message-circle" style="width:20px;height:20px"></i>
                    </div>
                    <span class="link-text">Tirar uma Dúvida</span>
                </div>
                <i data-lucide="arrow-right" class="link-arrow" style="width:18px;height:18px"></i>
            </a>
        </div>

        <!-- Highlight Area -->
        <div class="highlight-box reveal d-4">
            <div class="hb-eyebrow">Agendamento VIP</div>
            <h2 class="hb-title">Corte & Barba</h2>
            <p class="hb-desc">Evite filas. Reserve seu horário com antecedência de forma rápida pelo sistema.</p>
            <a href="#" class="hb-btn"><i data-lucide="calendar" style="width:18px;height:18px;margin-right:8px;"></i>
                Reservar Horário</a>
        </div>

        <!-- Socials -->
        <div class="footer-socials reveal d-5">
            <a href="#" class="social-link"><i data-lucide="instagram" style="width:20px;height:20px"></i></a>
            <a href="#" class="social-link"><i data-lucide="facebook" style="width:20px;height:20px"></i></a>
            <a href="#" class="social-link"><i data-lucide="youtube" style="width:20px;height:20px"></i></a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
